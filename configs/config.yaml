# Hyper-parameters used for every result in the paper (mirror of the Cfg dataclass in notebooks/03).
# The notebooks are the source of truth; this file documents them.
seed_default: 0            # used only when train_model is called without an explicit seed
data:
  seq_len: 30              # aligned windows per clip (frames and audio)
  image_size: 224
  face_padding: 0.20
  face_detector: MTCNN
  audio_sample_rate: 16000
backbones:                 # frozen; features cached by notebook 02
  visual: {name: efficientnet_b4, library: timm, output_dim: 1792}
  audio:  {name: WAV2VEC2_BASE, library: torchaudio, output_dim: 768}
model:
  d_model: 512
  gru_hidden: 256          # per direction -> 512
  gru_layers: 2
  n_heads: 8
  dropout: 0.4
  proj_dim: 128            # synchrony projection heads
loss:
  label_smoothing: 0.1
  lambda_sync: 0.5
  sync_temperature: 0.07
  max_shift: 8             # training shift is drawn from 2..8 windows
  lambda_adv: 0.1
  adv_sigma: 0.05
optimisation:
  optimiser: AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4
  schedule: OneCycleLR     # 10% warm-up
  epochs: 40
  batch_size: 64
  grad_clip: 1.0
  mixed_precision: fp16
  model_selection: best validation AUC
